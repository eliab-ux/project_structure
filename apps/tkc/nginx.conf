server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTTP Basic Auth — protects the sensitive document. Credentials are
    # checked against .htpasswd, generated at container start from env vars.
    # HTTPS is terminated upstream by Traefik/Let's Encrypt (Dokploy), so the
    # password always travels encrypted from the browser to the proxy.
    auth_basic "TKC - Acesso Restrito";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not leak nginx version in error pages / headers.
    server_tokens off;
}
